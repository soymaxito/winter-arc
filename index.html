<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Winter Arc</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter.woff2) format('woff2')}
.statusbar{position:fixed;top:0;left:0;right:0;height:var(--st);background:var(--bg);z-index:90;pointer-events:none}
html[data-theme=light] .statusbar{background:#111110}
.authp{font-size:15px;color:var(--ink2);line-height:1.55;margin:0 2px 6px}
.authin{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:16px;color:var(--ink);font-family:var(--sans);font-size:18px;padding:15px 16px;outline:none;margin-top:10px}
.authin:focus{border-color:var(--gold)}
.authin.code{font-size:28px;letter-spacing:.3em;text-align:center}
.autherr{color:#e3a2a2;font-size:14px;min-height:20px;margin-top:10px}
html[data-theme=light] .autherr{color:#a8444a}
.linkbtn{background:none;border:none;color:var(--ink3);font-size:14px;text-decoration:underline;cursor:pointer;margin:16px auto 0;display:block;padding:8px}
.impta{width:100%;min-height:160px;background:var(--field);border:1px solid var(--line2);border-radius:16px;color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:12px;outline:none;resize:vertical}
.update{position:fixed;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);z-index:160;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);cursor:pointer}
:root{
  --bg:#060606; --surfA:#1b1b1d; --surfB:#121214; --chipA:#262629; --chip:#1c1c1f;
  --edge:rgba(255,255,255,.13); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --ink:#f6f5f2; --ink2:#dcdbd7; --ink3:#b2b1ac; --ink4:#85847e;
  --track:#3b3b3f; --track2:#2b2b2f; --field:#0d0d0f; --icon:#f0efeb; --navbg:rgba(26,26,28,.94); --sheetA:#161618; --sheetB:#0c0c0d;
  --gold:#ecd47c; --acc:#ecd47c; --green:#ecd47c; --ongold:#14130f;
  --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:'Inter',system-ui,sans-serif; --heavy:'Inter',system-ui,sans-serif;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --surf:linear-gradient(180deg,var(--surfA),var(--surfB)); --surf2:linear-gradient(180deg,var(--chipA),var(--chip));
  --hi:inset 0 1px 0 rgba(255,255,255,.07); --drop:0 8px 20px rgba(0,0,0,.55);
}
html[data-theme=light]{
  --bg:#f1f0ec; --surfA:#ffffff; --surfB:#fbfaf7; --chipA:#ffffff; --chip:#f2f1ed;
  --edge:rgba(0,0,0,.10); --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15);
  --ink:#0f0f0e; --ink2:#2b2a27; --ink3:#4f4e49; --ink4:#73726c;
  --track:#d6d4cc; --track2:#e5e3dd; --field:#f4f3ef; --icon:#1a1a18; --navbg:rgba(255,255,255,.94); --sheetA:#ffffff; --sheetB:#f6f5f1;
  --gold:#a07c14; --acc:#a07c14; --green:#a07c14;
  --hi:inset 0 1px 0 rgba(255,255,255,1); --drop:0 6px 18px rgba(0,0,0,.08);
}
html[data-theme=light] .glow{display:none}
html[data-theme=light] .stack,html[data-theme=light] .grp,html[data-theme=light] .wtile,html[data-theme=light] .st{box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05)}
.trk{stroke:var(--track)} .trk2{stroke:var(--track2)} .dotf{fill:var(--track)} .tdy{stroke:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
body{min-height:100vh;overflow-x:hidden}
body.locked{overflow:hidden}
button{font-family:inherit;color:inherit;font-weight:inherit}
.glow{position:fixed;left:50%;top:-260px;width:620px;height:560px;transform:translateX(-50%);pointer-events:none;background:radial-gradient(50% 50% at 50% 50%,rgba(233,210,122,.09),transparent 70%)}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(14px + var(--st)) 20px calc(118px + var(--sb))}
.view{display:none}.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.bar{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.32em;color:var(--ink3);text-transform:uppercase}
.cbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:var(--surf2);box-shadow:var(--hi),var(--drop);display:grid;place-items:center;cursor:pointer;font-size:22px;font-weight:200;line-height:1}
.cbtn:active{transform:scale(.95)}
.cbtn svg{width:18px;height:18px}
.title{font-size:34px;font-weight:400;letter-spacing:-.01em;margin:6px 0 2px;line-height:1.1}
.subt{color:var(--ink3);font-size:14px;margin-bottom:20px}
.mantra{font-size:14px;color:var(--ink3);margin:2px 0 18px;font-style:italic}

/* cards */
.stack{position:relative;background:var(--surf);border:1px solid var(--edge);border-radius:22px;box-shadow:var(--hi);margin:0 0 10px;cursor:pointer;transition:transform .12s,background .2s}
.stack:active{transform:scale(.985)}
.stack.flat{cursor:default}.stack.flat:active{transform:none}
.stack.hero{border-radius:28px;box-shadow:var(--hi),0 20px 40px rgba(0,0,0,.6);background:var(--surf)}

.ring{position:relative;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring .ic{position:relative;color:var(--icon)}
.ring .ic svg{position:static;display:block}

.act{display:flex;align-items:center;gap:14px;padding:12px 14px}
.act .nm{font-size:17px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .val{text-align:right}
.act .val b{display:block;font-weight:500;font-size:16px;color:var(--ink)}
.act .val small{font-size:12px;color:var(--ink3)}

.trow{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 14px}
.trow .tx{flex:1;min-width:0}
.trow .nm{font-size:17px;font-weight:500}
.trow .pg{font-size:13.5px;color:var(--ink3);margin-top:3px}
.trow.met .pg{color:var(--gold)}
.bar-p{height:3px;border-radius:2px;background:var(--track);margin-top:10px;overflow:visible}
.bar-p i{display:block;height:100%;background:var(--gold);border-radius:2px;box-shadow:0 0 8px rgba(233,210,122,.55);transition:width .3s}
.qbtn{min-width:48px;height:48px;border-radius:16px;border:1px solid var(--line2);background:var(--surf2);box-shadow:var(--hi);font-size:20px;font-weight:400;cursor:pointer;padding:0 10px;display:grid;place-items:center}
.qbtn:active{transform:scale(.95)}
.qbtn.done{background:linear-gradient(180deg,#f1dc87,#d6bd5f);border-color:transparent;color:#14130f;box-shadow:0 0 16px rgba(233,210,122,.35);font-weight:500}
.qbtn.run{border-color:rgba(233,210,122,.6);color:var(--gold)}

/* arc hero */
.arc-top{display:flex;align-items:center;gap:20px;padding:20px 20px 14px}
.arc-top .big{position:relative;width:124px;height:124px;flex:none}
.arc-top .big svg{position:absolute;inset:0;transform:rotate(-90deg)}
.arc-top .big .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.arc-top .big .n{font-size:48px;font-weight:300;line-height:1;letter-spacing:-.03em}
.arc-top .big .s{font-size:12px;color:var(--ink3);margin-top:4px}
.arc-top .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.arc-top .side .an{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv b{font-size:24px;font-weight:400}
.kv b span{font-size:13px;color:var(--ink3)}
.kv small{display:block;font-size:11px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin-top:1px}
.hexrow{display:grid;grid-template-columns:repeat(7,1fr);padding:4px 16px 18px;text-align:center}
.hexrow .dl{font-size:12px;color:var(--ink3);height:14px;display:flex;align-items:center;justify-content:center}
.hexrow .dl.today{color:var(--ink);font-weight:500}
.hexrow .dn{font-size:12px;color:var(--ink3);margin-top:3px}
.hex{width:26px;height:26px;margin:6px auto 0;display:block;overflow:visible}
.label-sect{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3);margin:26px 2px 12px;display:flex;justify-content:space-between;align-items:baseline}
.label-sect em{font-style:normal;letter-spacing:.04em;text-transform:none}

/* widgets */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}
.wtile{aspect-ratio:1;border-radius:26px;border:1px solid var(--edge);background:var(--surf);box-shadow:var(--hi);display:grid;place-items:center;position:relative;cursor:pointer;overflow:hidden}
.wtile.ring svg.txt{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wtile.ring svg.txt,.tick-in{animation:none!important}}
.wtile .plus{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#f1dc87,#d6bd5f);color:#14130f;display:grid;place-items:center;font-size:28px;font-weight:300;box-shadow:0 0 22px rgba(233,210,122,.35)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:76%}
.mini i{aspect-ratio:1;border-radius:50%;border:1px solid var(--track)}
.mini i.l1{border:1.5px solid rgba(233,210,122,.45)}.mini i.l2{background:rgba(233,210,122,.45);border-color:transparent}.mini i.l3{background:var(--gold);border-color:transparent;box-shadow:0 0 6px rgba(233,210,122,.5)}
.wtile .cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}

.dsw{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;margin-bottom:4px}
.dsw button{background:none;border:none;color:var(--ink2);font-size:18px;cursor:pointer;padding:2px 6px;min-width:32px;min-height:32px}
.dsw button:disabled{opacity:.2}
.dsw .back{color:var(--gold);font-size:12px;cursor:pointer;border-bottom:1px solid rgba(233,210,122,.4)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 18px calc(16px + var(--sb));background:linear-gradient(180deg,transparent,var(--bg) 45%);display:flex;justify-content:center}
nav .in{display:flex;align-items:center;gap:4px;padding:6px;border-radius:30px;background:var(--navbg);border:1px solid var(--line2);box-shadow:var(--hi),0 12px 30px rgba(0,0,0,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
nav button{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:none;color:var(--ink2);border-radius:22px;height:44px;min-width:52px;padding:0 14px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s}
nav button svg{width:20px;height:20px}
nav button span{display:none}
nav button.on{background:var(--ink);color:var(--bg);padding:0 16px}
nav button.on svg{width:16px;height:16px}
nav button.on span{display:inline}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;max-width:480px;margin:0 auto;background:linear-gradient(180deg,var(--sheetA),var(--sheetB));border:1px solid var(--line2);border-bottom:none;border-radius:30px 30px 0 0;box-shadow:var(--hi),0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.8,.2,1);max-height:92vh;display:flex;flex-direction:column}
.sheet:not(.on){visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s}
.sheet.on{transform:none}
.sheet.full{top:calc(10px + var(--st));max-height:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--track);margin:10px auto 0;flex:none}
.sheet .sc{overflow-y:auto;padding:8px 20px calc(28px + var(--sb));-webkit-overflow-scrolling:touch}
.sh-bar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px}
.sh-title{font-size:30px;font-weight:300;margin:14px 0 16px;line-height:1.1}
.x-red{color:var(--ink2);font-size:16px}.ok-green{color:var(--gold);font-size:18px}
.cbtn.dis{opacity:.3;pointer-events:none}

.pick{padding:18px 18px 16px;overflow:hidden}
.pick .h{display:flex;justify-content:space-between;align-items:center}
.pick .h b{font-size:19px;font-weight:400}
.pick .h span{font-size:20px;color:var(--ink3)}
.pick p{margin:6px 0 12px;font-size:14px;color:var(--ink2)}
.ticker{overflow:hidden;white-space:nowrap;font-size:13px;color:var(--ink3);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .tick-in{display:inline-block;animation:tick 26s linear infinite}
.ticker .tick-in em{font-style:normal;color:var(--ink2)}
.ticker .tick-in s{text-decoration:none;color:var(--gold);opacity:.6}
@keyframes tick{to{transform:translateX(-50%)}}

.fl{font-size:12px;color:var(--ink3);margin:18px 6px 8px;letter-spacing:.04em}
.grp{background:var(--surf);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--hi);overflow:hidden}
.grp .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px;font-weight:500}
.grp .r:last-child{border-bottom:none}
.grp input[type=text],.grp input[type=number]{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--sans);font-size:16px;font-weight:400}
.grp input::placeholder{color:var(--ink4)}
.grp input[type=date]{background:var(--field);border:1px solid var(--line2);border-radius:12px;color:var(--ink);font-family:var(--sans);font-size:14px;padding:8px 10px;color-scheme:dark}
.syms{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:14px}
.syms button{aspect-ratio:1;border-radius:14px;border:1px solid transparent;background:var(--chip);cursor:pointer;display:grid;place-items:center;color:var(--icon)}
.syms button svg{width:20px;height:20px}
.syms button.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 12px rgba(233,210,122,.2)}
.cols{display:flex;gap:12px;padding:14px 16px;flex-wrap:wrap}
.cols button{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:var(--c)}
.cols button.on{box-shadow:0 0 0 2px var(--surfB),0 0 0 3.5px var(--c)}
.seg{display:flex;background:var(--field);border-radius:12px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{border:none;background:transparent;color:var(--ink3);font-size:13px;padding:7px 11px;border-radius:9px;cursor:pointer;font-weight:400}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:var(--hi)}
.sw{position:relative;width:50px;height:30px;border-radius:999px;background:var(--track);border:none;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--gold)}.sw.on::after{transform:translateX(20px);background:#14130f}
.wide{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;border:1px solid var(--line2);background:var(--surf2);box-shadow:var(--hi);font-size:16px;font-weight:500;cursor:pointer;margin-top:14px}
.wide.prim{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
.wide.acc{background:linear-gradient(180deg,#f1dc87,#d6bd5f);color:#14130f;border-color:transparent;font-weight:500;box-shadow:0 0 22px rgba(233,210,122,.25)}
.wide.danger{color:#d9a3a3;border-color:rgba(217,163,163,.25)}
.wide:active{transform:scale(.99)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--surf2);font-size:16px;cursor:pointer}
.stepper b{font-size:15px;min-width:30px;text-align:center;font-weight:400}

.agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acard{position:relative;padding:14px;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;margin:0}
.acard .ring{position:absolute;top:14px;left:14px}
.acard b{font-size:15px;font-weight:400}
.acard small{font-size:11px;color:var(--ink3)}
.acard .tickc{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#14130f;display:none;place-items:center;font-size:13px;font-weight:600}
.acard.on{border-color:rgba(233,210,122,.45)}
.acard.on .tickc{display:grid}
.goalrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:none}
.goalrow .nm{flex:1;font-size:14px;font-weight:400;min-width:0}

.lg-head{display:flex;align-items:center;gap:14px;margin:12px 0 6px}
.lg-head .nm{font-size:22px;font-weight:400}
.lg-head small{display:block;color:var(--ink3);font-size:12px;margin-top:2px}
.bignum{font-weight:300;font-size:84px;text-align:center;line-height:1;margin:22px 0 4px;letter-spacing:-.03em}
.bignum.mono{font-size:64px}
.bigcap{text-align:center;font-size:11px;letter-spacing:.24em;color:var(--ink3);text-transform:uppercase}
.tally-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;margin-top:22px}
.tb{padding:20px;border-radius:22px;border:1px solid var(--line2);background:var(--surf2);box-shadow:var(--hi);font-size:26px;font-weight:300;cursor:pointer}
.tb.plus{background:linear-gradient(180deg,#f1dc87,#d6bd5f);border-color:transparent;color:#14130f;font-weight:300;box-shadow:0 0 24px rgba(233,210,122,.3)}
.tb:active{transform:scale(.97)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surf2);font-size:13px;color:var(--ink2);cursor:pointer;font-weight:400;min-height:38px}
.chip:active{transform:scale(.96)}
.meas{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:20px}
.meas input{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:18px;color:var(--ink);font-family:var(--sans);font-size:30px;font-weight:300;padding:14px 16px;outline:none;text-align:center}
.meas input:focus{border-color:rgba(233,210,122,.6)}
.meas .u{color:var(--ink3);font-size:16px}
.note-in{width:100%;margin-top:10px;background:var(--field);border:1px solid var(--line2);border-radius:16px;color:var(--ink);font-family:var(--sans);font-size:15px;padding:13px 14px;outline:none}
.hist{margin-top:20px}
.he{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.he span{color:var(--ink3);font-size:13px}
.he b{font-weight:400}
.he .x{background:none;border:none;color:var(--ink4);font-size:18px;cursor:pointer;padding:2px 8px;min-width:36px;min-height:36px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.st{background:var(--surf);border:1px solid var(--edge);box-shadow:var(--hi);border-radius:20px;padding:14px}
.st b{display:block;font-size:21px;font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st:nth-child(2) b{color:var(--gold)}
.st small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;justify-items:center}

.hexcal{display:grid;grid-template-columns:repeat(7,1fr) 30px;gap:8px 0;align-items:center;text-align:center}
.hexcal .hd{font-size:11px;color:var(--ink3)}
.hexcal .wk{font-size:12px;color:var(--ink3);text-align:right}
.hexcal .wk.met{color:var(--gold)}
.hexcal svg{width:24px;height:24px;margin:0 auto;display:block;overflow:visible}
.empty{color:var(--ink3);font-size:14px;padding:18px 6px;line-height:1.5}

.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,20px);opacity:0;z-index:150;background:var(--navbg);border:1px solid var(--line2);box-shadow:var(--hi),0 10px 30px rgba(0,0,0,.6);color:var(--ink);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:400;transition:all .3s;pointer-events:none;white-space:nowrap;backdrop-filter:blur(12px)}

.toast b{color:var(--gold);font-weight:500}
.running{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:12px;font-weight:400}
.running .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 1.4s ease infinite}
@keyframes pulse{50%{opacity:.3}}
.running .t{font-size:20px;font-weight:300;margin-left:auto}
.sync{font-size:11px;color:var(--ink3);text-align:center;margin-top:22px}
.sync i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink4);margin-right:6px;vertical-align:1px}
.sync.ok i{background:var(--gold);box-shadow:0 0 6px var(--gold)}

// ---- log sheet ----
function openLog(aid) {
  const ac = act(aid); if (!ac) return; sheetAct = aid;
  const c = col(ac.color), d = viewDate, today = dayAmt(aid, d), tk = todayKey(), ws = wkStart(tk);
  const wk = amount(aid, ws, addDays(ws, 6)).sum, all = amount(aid, '0000-00-00', '9999-99-99');
  // streak of days with any entry
  let streak = 0, dd = dayAmt(aid, tk) > 0 ? tk : addDays(tk, -1); while (dayAmt(aid, dd) > 0) { streak++; dd = addDays(dd, -1); }
  let body = '';
  const dayLbl = d === tk ? 'today' : fmtShort(d).toLowerCase();
  if (ac.type === 'tally') {
    body = `<div class="bignum" id="lgNum">${round1(today)}</div><div class="bigcap">${dayLbl}</div>
      <div class="tally-btns"><button class="tb" id="lgMinus">−</button><button class="tb plus" id="lgPlus">+1</button></div>
      <div class="chips">${[5,10,20,50].map(n => `<button class="chip" data-add="${n}">+${n}</button>`).join('')}</div>`;
  } else if (ac.type === 'timed') {
    const running = S.timer && S.timer.a === aid;
    body = `<div class="bignum mono" id="lgTimer">${running ? '0:00' : fmtMin(today)}</div><div class="bigcap">${running ? 'running' : dayLbl + ' total'}</div>
      <button class="wide ${running ? 'prim' : 'acc'}" id="lgTimerBtn" style="--c:${c}">${running ? '■ stop &amp; log' : '▶ start timer'}</button>
      <div class="chips">${[10,15,20,30,45,60,90].map(n => `<button class="chip" data-add="${n}">+${fmtMin(n)}</button>`).join('')}</div>`;
  } else {
    body = `<div class="bignum mono" style="font-size:44px">${esc(fmtVal(ac, today))}</div><div class="bigcap">${dayLbl}</div>
      <div class="meas"><input id="lgVal" inputmode="decimal" placeholder="0"><span class="u">${esc(ac.unit || '')}</span></div>
      <input class="note-in" id="lgNote" maxlength="40" placeholder="note (e.g. 5 × 8, felt strong)">
      <button class="wide acc" id="lgAdd">log it</button>`;
  }
  const hist = S.entries.filter(e => e.a === aid).slice(-12).reverse();
  // 12-week heat for this activity
  let heat = ''; const hs = addDays(wkStart(tk), -77); const vals = [];
  for (let i = 0; i < 84; i++) { const x = addDays(hs, i); vals.push(x > tk ? null : dayAmt(aid, x)); }
  const mx = Math.max(1, ...vals.filter(v => v != null));
  vals.forEach(v => { heat += v == null ? '<i class="f"></i>' : `<i class="${!v ? '' : v / mx > .66 ? 'l3' : v / mx > .33 ? 'l2' : 'l1'}"></i>`; });
  openSheet(`<div class="sh-bar">${xBtn('shX')}<button class="cbtn" id="lgEdit" aria-label="Edit">✎</button></div>
    <div class="lg-head" style="--c:${c}">${symHTML(ac.sym, c, null, 52)}<div><div class="nm">${esc(ac.name)}</div><small>${TYPE_LABEL[ac.type].toLowerCase()}${ac.unit ? ' · ' + esc(ac.unit) : ''}</small></div></div>
    <div style="--c:${c}">${body}
    <div class="stats3"><div class="st"><b>${esc(fmtVal(ac, wk))}</b><small>this week</small></div><div class="st"><b>${streak}</b><small>day streak</small></div><div class="st"><b>${esc(ac.type === 'measured' ? all.count + '×' : fmtVal(ac, all.sum))}</b><small>all time</small></div></div>
    <div class="label-sect" style="margin-top:22px">12 weeks</div><div class="heat">${heat}</div>
    <div class="hist">${hist.length ? hist.map(e => `<div class="he"><span>${fmtShort(e.d)}${e.n ? ' · ' + esc(e.n) : ''}</span><b>${ac.type === 'tally' ? '+' + round1(e.v) : esc(fmtVal(ac, e.v))}</b><button class="x" data-del="${esc(e.id)}" aria-label="Delete entry">×</button></div>`).join('') : '<div class="empty">no entries yet.</div>'}</div></div>`);
  $('shX').onclick = closeSheet;
  $('lgEdit').onclick = () => openActivityForm(ac.type, ac);
  const rerender = () => { renderAll(); openLog(aid); };
  $('sheetBody').onclick = e => {
    const del = e.target.closest('[data-del]'); if (del) { S.entries = S.entries.filter(x => x.id !== del.dataset.del); save(); rerender(); return; }
    const add = e.target.closest('[data-add]'); if (add) { addEntry(aid, +add.dataset.add); buzz(12); rerender(); celebrate(aid); return; }
  };
  if (ac.type === 'tally') {
    $('lgPlus').onclick = () => { addEntry(aid, 1); buzz(12); rerender(); celebrate(aid); };
    $('lgMinus').onclick = () => { const es = entriesOn(aid, d); if (!es.length) return; const last = es[es.length-1];
      if (last.v > 1) last.v -= 1; else S.entries = S.entries.filter(x => x !== last); save(); rerender(); };
  } else if (ac.type === 'timed') { $('lgTimerBtn').onclick = () => toggleTimer(aid); tickTimer(); }
  else {
    const go2 = () => { const v = parseFloat(($('lgVal').value || '').replace(',', '.')); if (!isFinite(v) || v <= 0) { $('lgVal').focus(); return; } addEntry(aid, v, d, $('lgNote').value.trim()); buzz(12); rerender(); celebrate(aid); };
    $('lgAdd').onclick = go2; $('lgVal').onkeydown = e => { if (e.key === 'Enter') go2(); };
  }
}

      <div class="fl">Colour</div><div class="grp"><div class="cols" id="aCols">${Object.entries(COLORS).map(([k, v]) => `<button class="${k === f.color ? 'on' : ''}" style="--c:${col(k)}" data-c="${k}" aria-label="${k}"></button>`).join('')}</div></div>

      const row = e.target.closest('[data-i]'); if (!row) return; const it = f.items[+row.dataset.i];
      const rm = e.target.closest('[data-rm]'); if (rm) { f.items.splice(+rm.dataset.rm, 1); draw(); return; }

}

// ---- arc detail ----
function openArc(id) {
  const arc = S.arcs.find(a => a.id === id); if (!arc) return;
  const c = col(arc.color), st = arcStats(arc), tk = todayKey();
  const endW = arc.end ? wkStart(arc.end) : addDays(wkStart(tk), 7);
  const lastW = arc.end ? endW : (wkStart(tk) > endW ? wkStart(tk) : endW);
  let cal = `<div class="hexcal">${DOWS().map(d => `<div class="hd">${d}</div>`).join('')}<div></div>`;
  let rows = 0;
  for (let w = wkStart(arc.start); w <= lastW && rows < 60; w = addDays(w, 7), rows++) {
    for (let i = 0; i < 7; i++) { const d = addDays(w, i); cal += `<div>${hexSVG(arcDayState(arc, d), c, d === tk ? 'today' : '', '')}</div>`; }
    const m = arcWeekMet(arc, w); cal += `<div class="wk ${m ? 'met' : ''}">${w > tk ? '' : m === null ? '' : m ? '✓' : '·'}</div>`;
  }
  cal += '</div>';
  const ws = wkStart(tk);
  const goals = arc.items.map(it => { const ac = act(it.a); if (!ac) return '';
    const p = arc.kind === 'habit' ? itemProgress(it, tk) : null; const w = amount(it.a, ws, addDays(ws, 6)).sum;
    return `<div class="stack trow ${p && p.met ? 'met' : ''}" style="--c:${col(ac.color)}" data-act="${esc(ac.id)}">${symHTML(ac.sym, col(ac.color), p ? Math.min(1, p.v / p.goal) : null, 44)}<div class="tx"><div class="nm">${esc(ac.name)}</div>
      <div class="pg">${p ? `${esc(fmtVal(ac, p.v))} / ${esc(fmtGoal(ac, p.goal))} ${p.per === 'week' ? 'this week' : 'today'}` : `${esc(fmtVal(ac, w))} this week`}</div>${p ? `<div class="bar-p"><i style="width:${Math.min(100, p.v / p.goal * 100)}%"></i></div>` : ''}</div></div>`; }).join('');
  openSheet(`<div class="sh-bar">${xBtn('shX')}<button class="cbtn" id="arcEdit" aria-label="Edit arc">✎</button></div>
    <div class="lg-head" style="--c:${c}">${symHTML(arc.sym, c, null, 52)}<div><div class="nm">${esc(arc.name)}</div><small>${arc.kind === 'habit' ? 'habit arc' : 'unscripted arc'} · ${fmtShort(arc.start)}${arc.end ? ' → ' + fmtShort(arc.end) : ' → open'}</small></div></div>
    <div style="--c:${c}"><div class="stats3">
      <div class="st"><b>${st.dayN >= 1 ? st.dayN : 0}${st.total ? '<span style="font-size:12px;color:var(--ink3)">/' + st.total + '</span>' : ''}</b><small>day</small></div>
      <div class="st"><b>${arc.kind === 'habit' ? st.streak : st.active}</b><small>${arc.kind === 'habit' ? 'day streak' : 'days active'}</small></div>
      <div class="st"><b>${arc.kind === 'habit' ? (arcWeekMet(arc, ws) !== null ? st.wstreak + ' wk' : st.best) : st.best}</b><small>${arc.kind === 'habit' && arcWeekMet(arc, ws) !== null ? 'week streak' : 'best streak'}</small></div></div>
    ${arc.end && st.dayN >= 1 ? `<div class="bar-p" style="margin-top:14px;height:4px"><i style="width:${Math.min(100, st.dayN / st.total * 100)}%"></i></div><div style="font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:6px;text-align:right">${Math.max(0, st.total - st.dayN)} days to the finish line</div>` : ''}
    <div class="label-sect">the arc</div><div class="stack flat" style="padding:14px 10px">${cal}</div>
    <div class="label-sect">activities</div>${goals || '<div class="empty">no activities. tap ✎ to add some.</div>'}</div>`, true);
  $('shX').onclick = closeSheet;
  $('arcEdit').onclick = () => openArcForm(arc.kind, arc);
  $('sheetBody').onclick = e => { const el = e.target.closest('[data-act]'); if (el) openLog(el.dataset.act); };
}

// ---------------- nav ----------------
function go(v) {
  cur = v;
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  renderView(v); window.scrollTo({ top: 0 });
}
function renderView(v) { if (v === 'today') renderToday(); if (v === 'acts') renderActs(); if (v === 'arcs') renderArcs(); if (v === 'set') renderSet(); }
function renderAll() { renderToday(); renderActs(); renderArcs(); renderSet(); }
document.querySelector('nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (sheetOpen) closeSheet(); if (b.dataset.v === 'today') viewDate = todayKey(); go(b.dataset.v); };
let lastDay = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastDay) { if (viewDate === lastDay) viewDate = t; lastDay = t; if (!sheetOpen) renderAll(); } }, 60000);


// ---------------- theme ----------------
const TH_KEY = 'winterarc.theme';
const thPref = () => { try { return localStorage.getItem(TH_KEY) || 'dark'; } catch(e) { return 'dark'; } };
const mqLight = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
function applyTheme() {
  const p = thPref(), t = p === 'auto' ? (mqLight && mqLight.matches ? 'light' : 'dark') : p;
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#f1f0ec' : '#060606';
  document.querySelectorAll('#thSeg button').forEach(b => b.classList.toggle('on', b.dataset.t === p));
}
applyTheme();
if (mqLight && mqLight.addEventListener) mqLight.addEventListener('change', () => { if (thPref() === 'auto') { applyTheme(); renderAll(); } });
$('thSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; try { localStorage.setItem(TH_KEY, b.dataset.t); } catch(_) {} applyTheme(); renderAll(); };


// ---------------- installable app: service worker + updates ----------------
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const offer = w => { const b = $('updBtn'); b.hidden = false; b.onclick = () => { b.textContent = 'updating…'; w.postMessage('skip'); }; };
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return; w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); }); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    } catch(e) {}
  });
}

// ---------------- boot ----------------
const localV2 = normalise(lsGet(LS2));
S = localV2 || normalise(lsGet(LS1)) || seed(todayKey());
renderAll();
setSync(false, 'connecting…');
connect();
})();
</script>
</body>
</html>
